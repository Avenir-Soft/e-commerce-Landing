<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <title>Avenir</title>
  <!--
    The reticle mark exactly as `Mark` draws it in components/brand/Logo.tsx —
    same axes, same hollow diamonds, same four-point star — with no background.
    Set in the brand blue that already fills the loader's star, so it reads on
    a light tab strip and on a dark one; the navy of the raster logo would
    disappear against a dark browser chrome.
  -->
  <g stroke="#2563eb" fill="none">
    <path d="M60 8v104M8 60h104" stroke-width="2.6" />
    <g stroke-width="2.2">
      <rect x="56.8" y="4.8" width="6.4" height="6.4" transform="rotate(45 60 8)" />
      <rect x="56.8" y="108.8" width="6.4" height="6.4" transform="rotate(45 60 112)" />
      <rect x="4.8" y="56.8" width="6.4" height="6.4" transform="rotate(45 8 60)" />
      <rect x="108.8" y="56.8" width="6.4" height="6.4" transform="rotate(45 112 60)" />
    </g>
  </g>
  <path fill="#2563eb" d="M60 28Q60 60 92 60 60 60 60 92 60 60 28 60 60 60 60 28Z" />
</svg>
